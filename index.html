                '      <p style="margin:0;color:#e2e8f0;">Double-click <strong style="color:#ffffff;background:#8A1C7C;padding:2px 6px;border-radius:4px;">PREVIEW_WEBSITE.bat</strong> in this project folder. It will start a local server and open the live website in your browser instantly!</p>',

                '    </div>',
                '  </div>',

                '</div>'
              ].join('');
