<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="nariGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20B5E8" />
      <stop offset="45%" stop-color="#A00070" />
      <stop offset="100%" stop-color="#79005D" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D98B" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Icon: Modern Research Nexus -->
  <g transform="translate(10, 15)">
    <!-- Outer Hex/Shield Ring segments -->
    <path d="M50 5 L88 27 L88 73 L50 95 L12 73 L12 27 Z" 
          stroke="url(#cyanGrad)" stroke-width="2.5" stroke-dasharray="6 3" opacity="0.6" fill="none" />
    
    <!-- Dynamic Orbiting Waves -->
    <path d="M20 40 C35 15, 65 15, 80 40 C95 65, 65 90, 50 95 C35 90, 5 65, 20 40 Z" 
          fill="url(#nariGrad)" opacity="0.3" />

    <!-- Sharp Futuristic Research Blades -->
    <path d="M50 14 L80 32 L50 86 L20 32 Z" 
          fill="url(#nariGrad)" />
    
    <path d="M50 24 L72 38 L50 78 L28 38 Z" 
          fill="#07153A" opacity="0.85" />
          
    <path d="M50 32 L64 42 L50 70 L36 42 Z" 
          fill="url(#cyanGrad)" />

    <!-- Center Innovation Core Spark -->
    <circle cx="50" cy="50" r="5" fill="#FAFAFC" filter="url(#glow)" />
    <circle cx="50" cy="50" r="2.5" fill="#20B5E8" />
    
    <!-- Accent satellite node -->
    <circle cx="88" cy="27" r="3.5" fill="#F5D98B" />
    <circle cx="12" cy="73" r="3.5" fill="#20B5E8" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(125, 30)">
    <!-- Main Acronym: NARI -->
    <text x="0" y="44" 
          font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif" 
          font-size="48" 
          font-weight="800" 
          letter-spacing="5" 
          fill="#FAFAFC">
      NARI
    </text>
    
    <!-- Stylized dot or slash -->
    <rect x="156" y="16" width="6" height="32" rx="3" fill="url(#nariGrad)" />
    <rect x="166" y="24" width="4" height="24" rx="2" fill="url(#cyanGrad)" />

    <!-- Full Institutional Title -->
    <text x="2" y="68" 
          font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" 
          font-size="12" 
          font-weight="700" 
          letter-spacing="2.8" 
          fill="#20B5E8">
      NEW AGE RESEARCH INITIATIVES
    </text>

    <!-- Subtitle / Motto badge -->
    <text x="2" y="86" 
          font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" 
          font-size="9.5" 
          font-weight="500" 
          letter-spacing="1.8" 
          fill="#94A3B8">
      IDEAS TODAY. IMPACT TOMORROW.
    </text>
  </g>
</svg>
